version: "3.9"

# ─── Stack de Observabilidad ───────────────────────────────────────────────────
# Levanta con: docker compose up -d
# Grafana en: http://localhost:3001 (admin/admin)
# OTel Collector recibe en: 4317 (gRPC) y 4318 (HTTP)

services:

  # ── OTel Collector: recibe trazas del backend y frontend ─────────────────
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.98.0
    container_name: otel-collector
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel/config.yaml
    ports:
      - "4317:4317"   # gRPC OTLP (Java agent)
      - "4318:4318"   # HTTP OTLP (frontend React)
      - "8888:8888"   # métricas internas del Collector
    networks:
      - observabilidad

  # ── Tempo: almacén de trazas distribuidas ─────────────────────────────────
  tempo:
    image: grafana/tempo:2.4.1
    container_name: tempo
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./tempo-config.yaml:/etc/tempo.yaml
      - tempo-data:/var/tempo
    ports:
      - "3200:3200"   # HTTP de Tempo
      - "4317"        # gRPC interno (Collector → Tempo)
    networks:
      - observabilidad

  # ── Prometheus: métricas del backend (Actuator) ───────────────────────────
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - observabilidad

  # ── Grafana: visualización de trazas + métricas + logs ───────────────────
  grafana:
    image: grafana/grafana:10.4.1
    container_name: grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=false
    volumes:
      - ./grafana-provisioning:/etc/grafana/provisioning
      - grafana-data:/var/lib/grafana
    ports:
      - "3001:3000"   # Grafana UI
    depends_on:
      - tempo
      - prometheus
    networks:
      - observabilidad

networks:
  observabilidad:
    driver: bridge

volumes:
  tempo-data:
  grafana-data:
